[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chaseless"
version = "0.1.0"
description = "Adaptive, policy-bounded recurring revenue recovery for Razorpay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.2,<1",
  "orjson>=3.10,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-dateutil>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-mock>=3.14,<4",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/chaseless"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses call defaults.

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["apps.worker.*"]
# Celery 5 does not publish a py.typed marker; task signatures remain annotated locally.
disable_error_code = ["import-untyped", "untyped-decorator"]
