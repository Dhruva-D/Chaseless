services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaseless
      POSTGRES_USER: chaseless
      POSTGRES_PASSWORD: chaseless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaseless -d chaseless"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ${ENV_FILE:-.env}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ${ENV_FILE:-.env}
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ${ENV_FILE:-.env}
    command: celery -A apps.worker.celery_app worker --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    env_file: ${ENV_FILE:-.env}
    command: celery -A apps.worker.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      API_INTERNAL_URL: http://api:8000/api/v1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
